name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  semgrep:
    name: Semgrep security scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      # Isolated container image, not the `test` job's Python env: installing
      # semgrep alongside project deps downgrades opentelemetry and breaks
      # the Langfuse tracing integration (pipeline/tracing.py). --error makes
      # this fail the build on any finding — verified locally that without
      # it, semgrep exits 0 regardless of findings.
      - name: Run semgrep
        run: semgrep scan --config=p/security-audit --config=p/secrets --error

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'ci-dummy-key-for-import-check' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci-dummy-key-for-import-check' }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || 'ci-dummy-key-for-import-check' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Installed from the .lock files (fully pinned via `make lock`), not the
      # abstract >= specs in requirements*.txt — CI gets the exact same
      # dependency graph every run instead of whatever floats in latest.
      - name: Install production dependencies
        run: pip install -r requirements.lock

      - name: Install dev dependencies
        run: pip install -r requirements-dev.lock

      # ── Linting ─────────────────────────────────────────────────────
      - name: Ruff lint — pipeline modules
        run: |
          ruff check pipeline/ run_pipeline.py run_batches.py \
            merge_outputs.py qa_audit.py dashboard/

      - name: Ruff lint — tests
        run: ruff check tests/

      # ── Type checking ───────────────────────────────────────────────
      # Mirrors `make type-check`. Previously only run locally/pre-push —
      # a type error could merge to main undetected between local checks.
      - name: Mypy — pipeline modules
        run: mypy pipeline/ --ignore-missing-imports

      # ── Syntax check (fast fail on broken imports) ────────────────
      - name: Syntax check — all pipeline modules
        run: |
          python -m py_compile \
            pipeline/__init__.py \
            pipeline/config.py \
            pipeline/logger.py \
            pipeline/token_tracker.py \
            pipeline/hf_loader.py \
            pipeline/analyzer.py \
            pipeline/aggregator.py \
            pipeline/governance.py \
            pipeline/memory.py \
            pipeline/llm_clients.py \
            pipeline/circuit_breaker.py \
            pipeline/tracing.py \
            pipeline/orchestrator.py \
            pipeline/security.py \
            pipeline/vector_memory.py \
            pipeline/decision_log.py \
            pipeline/graph.py \
            pipeline/agents/__init__.py \
            pipeline/agents/data_agent.py \
            pipeline/agents/extraction_agent.py \
            pipeline/agents/quality_agent.py \
            pipeline/agents/aggregation_agent.py \
            pipeline/agents/insights_agent.py \
            pipeline/agents/export_agent.py

      - name: Syntax check — entry points and dashboard
        run: |
          python -m py_compile \
            run_pipeline.py \
            run_batches.py \
            merge_outputs.py \
            qa_audit.py \
            dashboard/app.py

      # ── Unit tests ───────────────────────────────────────────────
      - name: Run unit tests
        run: pytest tests/ -v --tb=short -m "not slow and not integration"

      # ── Docs/version sync ───────────────────────────────────────
      # Catches the exact drift this repo has hit before: pyproject.toml's
      # version diverging from CHANGELOG.md, or README/CONTRIBUTING quoting
      # a stale test count. See scripts/check_docs_sync.py.
      - name: Check docs are in sync (version, test count)
        run: python scripts/check_docs_sync.py

      # ── Coverage report ──────────────────────────────────────────
      # Floor is 85% — comfortably below the current ~91% so it only fires
      # on a real regression, not day-to-day noise. Previously
      # continue-on-error:true made this report-only, so coverage could
      # (and did) regress on individual modules with nothing to catch it.
      - name: Coverage report
        run: |
          pytest tests/ -m "not slow and not integration" \
            --cov=pipeline --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=85 \
            -q

      # ── Integration smoke test (compile + route only) ─────────────
      - name: LangGraph graph compiles and routing is correct
        run: |
          python -c "
          from pipeline.graph import build_pipeline, _route_after_quality
          pipeline = build_pipeline()
          assert callable(getattr(pipeline, 'invoke', None))

          # Normal path
          assert _route_after_quality({'qa_report': {}}) == 'aggregate'

          # Quality gate failure path
          assert _route_after_quality({'qa_report': {'_quality_gate_failed': True}}) == 'export'

          print('LangGraph compile + routing OK')
          "

      - name: Verify config module exports all constants
        run: |
          python -c "
          from pipeline import config
          required = [
              'EXTRACTION_MODEL', 'INSIGHTS_MODEL', 'MAX_OUTPUT_TOKENS',
              'BUDGET_USD', 'MIN_PASS_RATE', 'OUTPUT_DIR', 'MEMORY_PATH',
              'DEFAULT_BATCH_SIZE', 'DEFAULT_N_CALLS',
          ]
          missing = [k for k in required if not hasattr(config, k)]
          assert not missing, f'Missing config constants: {missing}'
          print(f'Config module OK — {len(required)} constants verified')
          "
