[project]
name = "telecom-call-intelligence"
version = "4.8.0"
description = "Multi-agent telecom call intelligence pipeline — LangGraph + Claude Haiku + NVIDIA NIM"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Vinoth N", email = "vinoth.n@outlook.com" }]
keywords = ["telecom", "nlp", "multi-agent", "langgraph", "claude", "nvidia-nim", "agentic-ai"]


# ── Ruff ───────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length    = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",   # line too long — handled per-file, not globally
    "E741",   # ambiguous variable name (l, O, I) — false-positives in ML code
]

[tool.ruff.lint.per-file-ignores]
"tests/*"        = ["F811"]   # redefined fixtures OK in test files

[tool.ruff.format]
quote-style = "double"


# ── Mypy ───────────────────────────────────────────────────────────────
[tool.mypy]
# No explicit python_version pin here (deliberately): mypy infers it from
# whichever interpreter actually runs it. CI's mypy step already runs
# inside both legs of the `python-version: ["3.11", "3.12"]` test matrix,
# so letting it float gives real per-version coverage instead of always
# pretending to be one fixed version.
#
# This used to be hardcoded to python_version="3.12" as a workaround: the
# requirements*.lock files resolve a *different* numpy per Python version
# (numpy 2.4.x for <3.12, numpy 2.5.3 for >=3.12), and only the >=3.12
# numpy's bundled .pyi stubs use `type X = ...` (PEP 695, 3.12-only) —
# mypy would crash parsing those stubs before checking a single line of
# our own code if its inferred target version was below 3.12. Hardcoding
# 3.12 avoided the crash but meant the 3.11 CI leg's mypy run never
# actually checked anything at 3.11 semantics. Now that we know the
# breakage is specific to the >=3.12 numpy build, floating the version
# works correctly on both legs: the 3.11 leg installs the 2.4.x numpy
# (no PEP 695 stubs, nothing to crash on) and the 3.12 leg's inferred
# target matches the 2.5.3 numpy it actually has installed.
# `follow_imports = "skip"` on numpy doesn't help either way (pandas pulls
# its stubs in transitively regardless). The real 3.11 syntax-compatibility
# guarantee remains CI's actual pytest matrix — a 3.12-only construct in
# our own code would fail that job's collection with a real SyntaxError,
# independent of mypy.
ignore_missing_imports = true
warn_unused_ignores    = false
warn_return_any        = false
strict_optional        = false   # TypedDict fields are not Optional by default
check_untyped_defs     = true    # without this, an unannotated def's body is never
                                  # type-checked at all — mypy silently skips it


# ── Pytest ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths   = ["tests"]
addopts     = "-v --tb=short"
markers     = [
    "slow: marks tests that make real API calls or download datasets (deselect with -m 'not slow')",
    "integration: marks full pipeline integration tests",
]
