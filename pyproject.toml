[project]
name = "telecom-call-intelligence"
version = "4.8.0"
description = "Multi-agent telecom call intelligence pipeline — LangGraph + Claude Haiku + NVIDIA NIM"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Vinoth N", email = "vinoth.n@outlook.com" }]
keywords = ["telecom", "nlp", "multi-agent", "langgraph", "claude", "nvidia-nim", "agentic-ai"]


# ── Ruff ───────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length    = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",   # line too long — handled per-file, not globally
    "E741",   # ambiguous variable name (l, O, I) — false-positives in ML code
]

[tool.ruff.lint.per-file-ignores]
"tests/*"        = ["F811"]   # redefined fixtures OK in test files

[tool.ruff.format]
quote-style = "double"


# ── Mypy ───────────────────────────────────────────────────────────────
[tool.mypy]
# 3.12, not 3.11 despite requires-python>=3.11 above: numpy's bundled .pyi
# stubs (as pinned in requirements.lock) use `type X = ...` (PEP 695,
# 3.12-only) — mypy crashes parsing them under a 3.11 target before checking
# a single line of our own code. `follow_imports = "skip"` on numpy doesn't
# help (pandas pulls its stubs in transitively regardless). The real 3.11
# syntax-compatibility guarantee is CI's actual `python-version: ["3.11",
# "3.12"]` pytest matrix — a 3.12-only construct in our own code would fail
# that job's collection with a real SyntaxError, independent of mypy.
python_version         = "3.12"
ignore_missing_imports = true
warn_unused_ignores    = false
warn_return_any        = false
strict_optional        = false   # TypedDict fields are not Optional by default
check_untyped_defs     = true    # without this, an unannotated def's body is never
                                  # type-checked at all — mypy silently skips it


# ── Pytest ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths   = ["tests"]
addopts     = "-v --tb=short"
markers     = [
    "slow: marks tests that make real API calls or download datasets (deselect with -m 'not slow')",
    "integration: marks full pipeline integration tests",
]
