repos:
  # Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.7
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # Prevent accidentally committing secrets
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^outputs/
      - id: trailing-whitespace
        exclude: ^outputs/
        # Markdown hard line-breaks are exactly 2 trailing spaces (e.g.
        # CLAUDE_CODE_COST_ANALYSIS.md) — without this, the hook strips them
        # and silently collapses intentional line breaks into soft-wraps.
        args: [--markdown-linebreak-ext=md]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]   # require PRs for main

  # Forbid committing .env files
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-case-conflict

  # Version/test-count drift guard — see scripts/check_docs_sync.py's
  # docstring for the incident history this replaces manual vigilance for.
  # Only runs when a doc, CHANGELOG, pyproject, or test file changed —
  # otherwise the pytest --collect-only subprocess is dead weight on every
  # unrelated commit.
  - repo: local
    hooks:
      - id: check-docs-sync
        name: Check docs are in sync (version, test count)
        # .venv/bin/python, not `python`/`python3` on PATH — the script shells
        # out to `pytest --collect-only`, which requires this repo's dev deps
        # (see CONTRIBUTING.md's `make install-dev` setup).
        entry: .venv/bin/python scripts/check_docs_sync.py
        language: system
        pass_filenames: false
        files: ^(README\.md|CONTRIBUTING\.md|CHANGELOG\.md|ARCHITECTURE\.md|pyproject\.toml|tests/.*)$

  # Security static analysis (SAST) — secrets and injection/security
  # anti-patterns ruff doesn't check for. Runs in its own isolated
  # pip-installed environment, never this repo's venv: installing semgrep
  # alongside project deps downgrades opentelemetry and breaks the
  # Langfuse tracing integration (pipeline/tracing.py).
  #
  # Uses semgrep/pre-commit (a small hook-only repo), not semgrep/semgrep
  # directly — the main repo drags in unrelated git submodules over SSH
  # (tree-sitter grammars) that fail to clone without SSH access configured.
  - repo: https://github.com/semgrep/pre-commit
    rev: v1.177.0
    hooks:
      - id: semgrep
        args:
          - --config=p/security-audit
          - --config=p/secrets
          - --error
          - --disable-version-check
          - --quiet
