services:
  - type: web
    name: cci-ai-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.lock
    startCommand: uvicorn demo.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEMO_MOCK_ONLY
        value: "1"
      - key: PYTHON_VERSION
        value: 3.11.9
